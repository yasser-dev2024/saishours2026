name: Publish Sayes Alkhayl APK release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release-apk.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare the stable download filename
        run: cp "download_page/downloads/Sayes-Alkhayl-1.3.2.apk" "HorseClub.apk"

      - name: Publish APK as the latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v1.3.2"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "HorseClub.apk" --clobber
            gh release delete-asset "$RELEASE_TAG" "Sayes-Alkhayl-1.3.2.apk" --yes || true
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" \
              "HorseClub.apk" \
              --title "سايس الخيل 1.3.2" \
              --notes "الإصدار الكامل 1.3.2 للأندرويد. ملف موحّد للجوال واللوحي، مبني على Android API 35 وموقّع بتوقيعي Android v1 وv2 للتوافق الواسع." \
              --latest
          fi
