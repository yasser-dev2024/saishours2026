name: Publish Sayes Alkhayl APK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish APK as the latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "download_page/downloads/Sayes-Alkhayl-1.3.1.apk#HorseClub.apk" \
            --title "سايس الخيل 1.3.1" \
            --notes "الإصدار الكامل 1.3.1 للأندرويد. ملف موحّد للجوال واللوحي وموقّع بتواقيع Android v1 وv2 وv3." \
            --latest
