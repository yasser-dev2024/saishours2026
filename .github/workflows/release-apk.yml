name: Publish Sayes Alkhayl Android release

on:
  push:
    branches:
      - main
    paths:
      - "releases/Sayes-Alkhayl-v2.1.0.apk"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish the verified Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v2.1.0"
          APK="releases/Sayes-Alkhayl-v2.1.0.apk"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" \
              "$APK" \
              --title "سايس الخيل Android 2.1.0" \
              --notes "إصدار تثبيت مستقل بهوية Android جديدة لمنع أي تعارض مع النسخ السابقة، مع دعم ARM وARM64 وx64 وAndroid 5.0 فأحدث." \
              --latest
          fi
