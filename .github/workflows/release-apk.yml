name: Publish Sayes Alkhayl Android release

on:
  push:
    branches:
      - main
    paths:
      - "releases/Sayes-Alkhayl-v2.0.0.apk"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish the verified Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v2.0.0"
          APK="releases/Sayes-Alkhayl-v2.0.0.apk"
          OLD_ASSET="Sayes-Alkhayl-Android.apk"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
            gh release delete-asset "$RELEASE_TAG" "$OLD_ASSET" --yes || true
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" \
              "$APK" \
              --title "سايس الخيل Android 2.0.0" \
              --notes "مشروع Android الجديد الكامل لتطبيق سايس الخيل. يشمل جميع وحدات الخيول والمشتركين والاشتراكات والحجوزات والرعاية والمالية والتنبيهات والتقارير والنسخ الاحتياطي، ويعمل دون إنترنت ودون مفتاح تفعيل." \
              --latest
          fi
